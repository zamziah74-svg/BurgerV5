name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production with Vite
        run: npm run build

      - name: Create 404 Fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Verify Production Build
        run: |
          node -e "
          const fs = require('fs');
          if (!fs.existsSync('dist/index.html')) {
            console.error('ERROR: dist/index.html does not exist!');
            process.exit(1);
          }
          const html = fs.readFileSync('dist/index.html', 'utf8');
          if (html.includes('/src/main.tsx')) {
            console.error('ERROR: dist/index.html contains /src/main.tsx! Build failed to transform source entry.');
            process.exit(1);
          }
          if (!html.includes('/BurgerV5/assets/')) {
            console.error('ERROR: dist/index.html does not contain /BurgerV5/assets/ base path!');
            process.exit(1);
          }
          console.log('SUCCESS: Verified dist/index.html exists, has compiled assets, and does not contain /src/main.tsx');
          "

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
