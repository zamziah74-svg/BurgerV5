name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Project (Vite)
        run: |
          npm run build
          cp ./dist/index.html ./dist/404.html 2>/dev/null || true

      - name: Verify Production Build
        run: |
          if [ ! -f ./dist/index.html ]; then
            echo "ERROR: dist/index.html was not generated!"
            exit 1
          fi
          if grep -q "/src/main.tsx" ./dist/index.html; then
            echo "ERROR: dist/index.html contains /src/main.tsx! Production build must not serve source files."
            exit 1
          fi
          echo "SUCCESS: Verified that dist/index.html exists and contains compiled assets."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Build Artifact (dist folder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
